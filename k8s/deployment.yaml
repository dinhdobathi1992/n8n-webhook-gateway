apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-webhook-gateway
  namespace: platformbot
  labels:
    app: n8n-webhook-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-webhook-gateway
  template:
    metadata:
      labels:
        app: n8n-webhook-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n-webhook-gateway
          image: dinhdobathi/n8n-webhook-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - secretRef:
                name: n8n-webhook-gateway-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
