services:
  gateway:
    image: dinhdobathi/n8n-webhook-gateway:latest
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - gateway-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/gateway.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
