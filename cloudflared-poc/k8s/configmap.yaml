apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: n8n
  labels:
    app: cloudflared
data:
  config.yaml: |
    tunnel: b9d0237a-df73-48cb-9024-07f26c8b9025
    metrics: 0.0.0.0:2000

    ingress:
      - hostname: n8n-cactus.theiconic.tech
        path: "^/webhook.*"
        service: http://n8n-service.n8n.svc.cluster.local:5678
        originRequest:
          connectTimeout: 10s

      # Catch-all: block everything else
      - service: http_status:404
