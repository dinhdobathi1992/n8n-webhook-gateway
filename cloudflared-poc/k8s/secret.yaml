# DO NOT commit with real token — use kubectl create secret instead:
#   kubectl create secret generic cloudflared-secret \
#     --namespace=n8n \
#     --from-literal=token="YOUR_TUNNEL_TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secret
  namespace: n8n
  labels:
    app: cloudflared
type: Opaque
stringData:
  token: "REPLACE_ME"
